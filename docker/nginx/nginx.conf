worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  upstream api      { server backend:3000; }
  upstream userapp  { server frontend:80;  }
  upstream adminapp { server admin:80;     }

  # --- API ---
  server {
    listen 80;
    server_name api.localhost;

    location / {
      proxy_pass         http://api;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # --- Painel do usuário ---
  server {
    listen 80 default_server;
    server_name _;

    location /api/ {
      proxy_pass         http://api/api/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /uploads/ {
      proxy_pass         http://api/uploads/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws/ {
      proxy_pass         http://api/ws/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }
    location /docs    { proxy_pass http://api/docs; }
    location /health  { proxy_pass http://api/health; }

    location / { proxy_pass http://userapp; }
  }

  # --- Painel admin (subdomínio admin.localhost) ---
  server {
    listen 80;
    server_name admin.localhost;

    location /api/     { proxy_pass http://api/api/; }
    location /uploads/ { proxy_pass http://api/uploads/; }
    location /         { proxy_pass http://adminapp; }
  }
}
